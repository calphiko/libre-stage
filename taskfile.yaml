version: '3'

tasks:
  install:
    cmds:
      - uv sync --all-groups
    desc: "Install all dependencies (including dev) via uv"

  frontend-dev:
    env:
      VITE_API_URL: "http://localhost:8000"
    cmds:
      - echo "Starting Frontend Server..."
      - cd frontend && npm run dev
    desc: "Start the frontend development server"

  backend-dev:
    #env:
     # CORS_ORIGINS: "http://localhost:5173"
     # DOCS_URL: "/docs"
     # OPENAPI_URL: "/openapi.json"
    cmds:
      - echo "Starting Backend Server..."
      - uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug --log-config ./backend/log_conf.json
    desc: "Start the backend development server"

  test:
    cmds:
      - uv run pytest
    desc: "Run the test suite"
