version: '3'

tasks:
  install:
    cmds:
      - uv sync --all-groups
    desc: "Install all dependencies (including dev) via uv"

  frontend-dev:
    env:
      VITE_API_URL: "http://localhost:8000"
    cmds:
      - echo "Starting Frontend Server..."
      - cd frontend && npm run dev
    desc: "Start the frontend development server"

  backend-dev:
    #env:
     # CORS_ORIGINS: "http://localhost:5173"
     # DOCS_URL: "/docs"
     # OPENAPI_URL: "/openapi.json"
    cmds:
      - echo "Starting Backend Server..."
      - uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --log-config ./backend/log_conf.json
    desc: "Start the backend development server"

  test:
    cmds:
      - uv run pytest
    desc: "Run the test suite"

  # ── Alembic / Datenbankmigrationen ─────────────────────────────────────────

  db:migrate:
    cmds:
      - uv run alembic upgrade head
    desc: "Alle ausstehenden Migrationen anwenden (upgrade head)"

  db:rollback:
    cmds:
      - uv run alembic downgrade -1
    desc: "Letzte Migration rückgängig machen (downgrade -1)"

  db:revision:
    cmds:
      - uv run alembic revision --autogenerate -m "{{.MSG}}"
    desc: "Neue Migration aus Modeländerungen generieren  →  task db:revision MSG='beschreibung'"

  db:history:
    cmds:
      - uv run alembic history --verbose
    desc: "Migrationsverlauf anzeigen"

  db:current:
    cmds:
      - uv run alembic current
    desc: "Aktuellen Migrationsstand der DB anzeigen"

  db:init-demo:
    cmds:
      - uv run python backend/migrations/init_demo_db.py
    desc: "Demo-Datenbank mit Beispieldaten befüllen"


