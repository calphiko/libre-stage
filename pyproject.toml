[project]
name = "libre-stage"
version = "0.1.0"
description = "Band rehearsal and gig management software"
requires-python = ">=3.11"
dependencies = [
    "annotated-doc==0.0.4",
    "anyio==4.12.1",
    "bcrypt==5.0.0",
    "certifi==2026.2.25",
    "charset-normalizer==3.4.4",
    "click==8.3.1",
    "colorama==0.4.6",
    "cowsay==6.1",
    "Deprecated==1.3.1",
    "dnspython==2.8.0",
    "ecdsa==0.19.1",
    "email-validator==2.3.0",
    "et_xmlfile==2.0.0",
    "fastapi==0.135.0",
    "greenlet==3.3.2",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "icalendar==7.0.2",
    "idna==3.11",
    "limits==5.8.0",
    "openpyxl==3.1.5",
    "packaging==26.0",
    "passlib==1.7.4",
    "pillow==12.1.1",
    "pyasn1==0.6.2",
    "pydantic==2.12.5",
    "pydantic_core==2.41.5",
    "PyJWT==2.11.0",
    "PyMySQL==1.1.2",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "pytz==2025.2",
    "reportlab==4.4.10",
    "requests==2.32.5",
    "rsa==4.9.1",
    "six==1.17.0",
    "slowapi==0.1.9",
    "sniffio==1.3.1",
    "alembic>=1.15.0",
    "SQLAlchemy==2.0.47",
    "starlette==0.52.1",
    "typing-inspection==0.4.2",
    "typing_extensions==4.15.0",
    "tzdata==2025.3",
    "urllib3==2.6.3",
    "uvicorn==0.41.0",
    "wrapt==2.1.1",
]

[dependency-groups]
dev = [
    "coverage==7.13.4",
    "Faker==40.5.1",
    "iniconfig==2.3.0",
    "pluggy==1.6.0",
    "Pygments==2.19.2",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-intl>=2.0.0",
    "sphinx-copybutton>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --cov=backend --cov-report=html --cov-report=term-missing"



