[project]
name = "libre-stage"
version = "0.5.18"
description = "Band rehearsal and gig management software"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.135.0",
    "uvicorn==0.41.0",
    "slowapi==0.1.9",
    # Database
    "SQLAlchemy==2.0.47",
    "alembic>=1.15.0",
    "PyMySQL==1.1.2",
    # Auth & Security
    "bcrypt==5.0.0",
    "PyJWT==2.11.0",
    # Data validation
    "pydantic==2.12.5",
    "email-validator==2.3.0",
    # HTTP client
    "requests==2.32.5",
    # File / document generation
    "reportlab==4.4.10",
    "openpyxl==3.1.5",
    "pillow==12.1.1",
    "pathvalidate>=3.3.1",
    # Calendar
    "icalendar==7.0.2",
    # Utilities
    "python-dotenv==1.2.2",
    "pytz==2025.2",
    "tzdata==2025.3",
]

[dependency-groups]
dev = [
    "coverage==7.13.4",
    "Faker==40.5.1",
    "iniconfig==2.3.0",
    "pluggy==1.6.0",
    "Pygments==2.19.2",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-intl>=2.0.0",
    "sphinx-copybutton>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --cov=backend --cov-report=html --cov-report=term-missing "

[tool.coverage.run]
omit = [
    "backend/migrations/*",
    "backend/tests/*",
    "backend/alembic/*",
    "*/conftest.py"
]
