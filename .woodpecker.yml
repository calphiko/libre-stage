labels:
  branch: ${CI_REPO_BRANCH}

steps:
  - name: test-and-coverage
    image: python:3.14
    commands:
      - cp .env.example .env
      - pip install uv
      - uv sync --all-groups
      - uv run pytest --cov=backend --cov-report=xml --cov-report=term
      - uv run coverage report --fail-under=75
