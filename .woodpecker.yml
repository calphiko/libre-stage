labels:
  branch: ${CI_REPO_BRANCH}

steps:
  - name: test-and-coverage
    image: python:3.14
    environment:
      DATABASE_URL: "sqlite:///:memory:"
      TESTING: "true"
    commands:
      - pip install uv
      - uv sync --all-groups
      - uv run pytest --cov=backend --cov-report=xml --cov-report=term
      - uv run coverage report --fail-under=75
