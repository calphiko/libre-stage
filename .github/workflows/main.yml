name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i 's/SECRET_KEY=.*/SECRET_KEY=supersecretkey/' .env

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests with coverage
        run: uv run pytest --cov=backend --cov-report=xml --cov-report=term

      - name: Check coverage threshold
        run: uv run coverage report --fail-under=50

  build-and-deploy-docs:
    runs-on: ubuntu-latest
    needs: test-and-coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
  
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
  
      - name: Install uv
        run: pip install uv
  
      - name: Install docs dependencies
        run: uv sync --group docs
  
      - name: Get version
        id: version
        run: echo "version=$(python3 -c "import json; print(json.load(open('version.json'))['release'])")" >> $GITHUB_OUTPUT
  
      - name: Build German docs
        run: |
          uv run sphinx-build -b html -D language=de docs/manual docs/manual/_build/html/de
          mkdir -p public/de public/${{ steps.version.outputs.version }}/de
          cp -r docs/manual/_build/html/de/. public/de/
          cp -r docs/manual/_build/html/de/. public/${{ steps.version.outputs.version }}/de/
  
      - name: Build English docs
        run: |
          uv run sphinx-build -b html -D language=en docs/manual docs/manual/_build/html/en
          mkdir -p public/en public/${{ steps.version.outputs.version }}/en
          cp -r docs/manual/_build/html/en/. public/en/
          cp -r docs/manual/_build/html/en/. public/${{ steps.version.outputs.version }}/en/
  
      - name: Create language redirect page
        run: |
          cat > public/index.html << 'HTMLEOF'
          <!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=de/">
          <title>libreStage Docs</title>
          <style>body{font-family:sans-serif;max-width:600px;margin:4rem auto;text-align:center}
          a{display:inline-block;margin:1rem;padding:.75rem 2rem;background:#2980b9;color:#fff;
          text-decoration:none;border-radius:4px}a:hover{background:#1a5276}</style></head>
          <body><h1>libreStage Documentation</h1><p>Please select your language:</p>
          <a href="de/">Deutsch</a> <a href="en/">English</a></body></html>
          HTMLEOF
  
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          commit_message: "docs: deploy ${{ steps.version.outputs.version }} [skip ci]"
          user_name: libreStage CI
          user_email: ci@librestage
  
